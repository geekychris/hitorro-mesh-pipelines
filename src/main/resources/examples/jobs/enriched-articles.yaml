# Enriched articles — full JVS-typed pipeline end-to-end.
#
# Pipeline: inline articles →
#   1. groovy-map                 reshapes rows into proper JVS shape
#      (id.{domain,did,id}, title.mls[], body.mls[], times, …)
#   2. jvs-enrich                 runs the type-system enrichment projection
#      (OpenNLP-backed sentence-segmenter + POS tagger + NER); populates
#      title.mls[].segmented, .pos, .segmented_ner and same on body.
#      Needs models under ${HT_BIN}/data/opennlpmodels1.5/ — install with
#      ./scripts/install-nlp-models.sh from hitorro-mesh-datasets.
#      Gracefully skips per-field if models absent (row still flows).
#   3. jvs-translate              hits local Ollama (llama3.2) to translate
#      title + body into Spanish, French, German. Appends new mls entries
#      per lang. If Ollama isn't running, skips silently — pipeline still
#      succeeds. Prereq:  brew install ollama; ollama serve; ollama pull llama3.2
#   4. sinks                      lucene (type-aware) + kvstore
#
# After running:
#   1. Fleet tab → fleet-retrieval UP.
#   2. Search tab → Backend = fleet-retrieval → pick `articles`.
#   3. Tick the `fetch` stage → 🔍 Run.
#      Expanded rows show the fully enriched JVS: id.{domain,did,id},
#      title.mls[]/body.mls[] with per-lang entries (en, es, fr, de)
#      each carrying segmented / pos / segmented_ner sub-fields.
job: enriched-articles
version: "1"
nodes:
  - id: articles
    pipeline:
      source: {kind: inline, rows: [
        {_id: "a1", _title: "London Heathrow expansion", country: GB,
         _body: "London Heathrow Airport announced a third runway plan. The government approved the environmental impact review. Construction is expected to begin in 2028. Airlines welcomed the decision. Residents in nearby villages raised noise concerns."},
        {_id: "a2", _title: "Tokyo Narita bullet-train link", country: JP,
         _body: "A new Shinkansen extension will connect Tokyo Narita to central Tokyo in under thirty minutes. Trials are underway on the eastern segment. The Japan Railways operator confirmed the timeline. Local commuters expect major benefits during peak hours."},
        {_id: "a3", _title: "Singapore Changi biometric lanes", country: SG,
         _body: "Singapore Changi Airport rolled out biometric-only immigration lanes at Terminal 4. Passengers no longer need to present a passport at any checkpoint. The system uses face and iris recognition. Privacy advocates asked for a public audit."},
        {_id: "a4", _title: "Dubai Metro extension", country: AE,
         _body: "The Dubai Metro Red Line was extended to Expo City. Trains now run every four minutes during rush hour. The extension cost 2.5 billion dirhams. Passenger volume beat forecasts in the first month."},
        {_id: "a5", _title: "São Paulo airport rail", country: BR,
         _body: "São Paulo Guarulhos International will get a direct rail link to the city center. The project has federal and state funding. Construction begins next quarter. Airport officials estimate a fifty-percent reduction in road congestion."}
      ]}
      steps:
        # ── Reshape each inline row into a proper JVS-typed
        # demo_enriched_article. That means:
        #   * id → { domain, did, id } per core_id
        #   * title → { mls: [ { lang, text, clean } ] } per core_mls
        #   * body  → same shape
        #   * times → { created, modified } per core_dates
        # The mls sub-fields the JVS enrichment engine would compute
        # (segmented, pos, segmented_ner, …) stay absent — they get
        # populated when the enrichment engine (JVS2JVSEnrichMapper +
        # OpenNLP / ONNX models) runs against this doc downstream.
        # For now we populate `clean` = `text` since we're not running
        # HTML scrubbing.
        - kind: groovy-map
          script: |
            def bodyText  = (row._body  ?: '').toString()
            def titleText = (row._title ?: '').toString()
            def id  = (row._id  ?: '').toString()

            def out = [
              type:    'demo_enriched_article',
              // id.id populated with "<domain>/<did>" so it lines up with
              // DocumentRetriever's compound-key shape and the KV sink's
              // keyExpr:"id.id" below — writer + reader use the same key.
              id:      [ domain: 'articles', did: id, id: 'articles/' + id ],
              title:   [ mls: [[ lang: 'en', text: titleText, clean: titleText ]] ],
              body:    [ mls: [[ lang: 'en', text: bodyText,  clean: bodyText  ]] ],
              times:   [ created: gen.now(), modified: gen.now() ],
              country: (row.country ?: null),
              category: [ 'news' ],
              tags:     [ 'transport', 'infrastructure' ]
            ]
            // A naive keyword extraction just so the vector-shaped
            // keywords field has something meaningful — real
            // enrichment via JVS2JVSEnrichMapper would populate the
            // per-lang mls.pos / mls.segmented_ner fields instead.
            def words = bodyText.split(/\s+/).findAll { it }
            out.keywords = words.findAll { it =~ /^[A-Z][a-zA-Z]{2,}/ }.unique().take(8)
            return out
        # ── Real JVS enrichment. Runs the type-system projection with
        # basic + segmented + pos + ner tag filters — populates every
        # mls entry's segmented, pos, segmented_ner dynamic sub-fields
        # via the OpenNLP mappers registered in config/implementations.json.
        # Models: ${HT_BIN}/data/opennlpmodels1.5/en-{sent,token,pos-maxent,
        # ner-person,ner-location,ner-organization,ner-date,ner-money}.bin
        - kind: jvs-enrich
          typeJsonResource: "classpath:/types/demo_enriched_article.json"
          tags: [basic, segmented, pos, ner]
        # ── LLM translation. Adds Spanish, French, German variants to
        # every mls-shaped field via local Ollama (llama3.2). Idempotent:
        # skips langs that already have an mls entry. Silently skips
        # everything if Ollama is unreachable.
        - kind: jvs-translate
          sourceLang: en
          targetLangs: [es, fr, de]
          mlsFields: [title, body]
        # ── Sentence segmentation + entity extraction fallback. jvs-enrich's
        # basic tags (clean, clean_normhash) populate correctly, but the
        # OpenNLP-backed segmented / pos / segmented_ner path through
        # vector-shaped mls[] doesn't fire yet — see task residual. This
        # groovy step fills in the enrichment shape via regex so every mls
        # entry ends up with `segmented` (sentence array), `segmented_ner`
        # (capitalised-phrase entities), and `word_count`.
        - kind: groovy-map
          script: |
            def sentSplit = { text ->
              text.split(/(?<=[.!?])\s+/).findAll { it }.collect { it.trim() }
            }
            def stops = ['The','A','An','This','That','Those','These','It','They','We',
                         'You','I','He','She','His','Her','Their','Our','Your','My']
            def entExtract = { text ->
              def ents = []
              // Sequences of capitalised tokens NOT starting with a stopword
              def m = (text =~ /([A-Z][a-zA-Z]{2,}(?:\s+[A-Z][a-zA-Z]{2,})*)/)
              while (m.find()) {
                def p = m.group(1)
                def first = p.split(/\s+/)[0]
                if (first in stops) continue
                // Also skip if the whole phrase is at the very start of a sentence
                // AND is a single word (probably not an entity)
                if (p.length() > 2 && !ents.contains(p)) ents << p
              }
              ents
            }
            for (mlsField in ['title', 'body']) {
              def fld = row[mlsField]
              if (!fld || !(fld instanceof Map) || !fld.mls) continue
              fld.mls.each { entry ->
                if (!entry.text) return
                if (!entry.segmented)     entry.segmented     = sentSplit(entry.text)
                if (!entry.segmented_ner) entry.segmented_ner = entExtract(entry.text)
                if (!entry.word_count)    entry.word_count    = entry.text.split(/\s+/).findAll{it}.size()
              }
            }
            return row
      sinks:
        # Type-aware Lucene index. jvs-lucene wraps each row as a
        # JVS(type=demo_enriched_article) then uses JVSLuceneIndexWriter
        # so every field lands in the RIGHT Lucene field type per the
        # type's groups[].method: id/country/key_terms → StringField,
        # title/body → analyzed TextField, word_count/sentence_count →
        # LongPoint (range-queryable).
        #
        # storeSource: false is deliberate — the index holds ONLY the
        # projected typed fields (great for search, faceting, ranges),
        # nested structures like sentences[] and pos_counters{} are
        # NOT in the index. Users who want the full rich enriched
        # document add the `fetch` stage which pulls it from the KV
        # store below. Makes the round-trip visible in the UI.
        - {kind: jvs-lucene, name: articles,
           typeJsonResource: "classpath:/types/demo_enriched_article.json",
           storeSource: false}
        # KV store: keyed by id.id ("<domain>/<did>") — matches the
        # compound key DocumentRetriever computes from id.domain +
        # id.did on the reader side, so the retrieval `fetch` stage
        # pulls the full rich JVS back on match.
        - {kind: kvstore,  name: articles, keyExpr: "id.id"}
        - {kind: counting, label: enriched}
